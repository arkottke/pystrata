# Scientific data files are read with fixed-width or exact parsing, so the
# whitespace and end-of-file hooks must not rewrite them.
exclude: '^(data/|tests/data/|src/pystrata/data/|examples/data/)'
repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.15.4
      hooks:
                # Run the formatter.
          - id: ruff-format
            # Run the linter.
          - id: ruff
            args:
                [--fix]
    - repo: https://github.com/PyCQA/docformatter
      rev: v1.7.7
      hooks:
          - id: docformatter
            language_version: python3.12
            args:
                [--in-place, --wrap-summaries=88, --wrap-descriptions=88]
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: check-json
          # Unsafe required for mkdocs.yml format
          - id: check-yaml
            args: [--unsafe]
          - id: check-toml
          - id: end-of-file-fixer
          - id: requirements-txt-fixer
    - repo: local
      hooks:
          # Pinned: the pre-commit mirror only offers 4.0 alphas after 3.1.0, and
          # 4.0.0-alpha.8 hangs. Needs node on PATH.
          - id: prettier
            name: prettier
            entry: prettier --write --ignore-unknown
            language: node
            additional_dependencies: ["prettier@3.9.10"]
            files: \.(md|yml)$
