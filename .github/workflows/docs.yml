name: Build docs

on: [push, pull_request]

jobs:
    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "latest"
            # nbsphinx converts the notebooks with pandoc
            - name: Install pandoc
              run: sudo apt-get update && sudo apt-get install -y pandoc
            # Warnings are errors, so that broken references and markup are caught
            - name: Build the documentation
              run: uv run --extra docs sphinx-build -b html -W --keep-going docs docs/_build/html
