# Uploads the package to PyPI when a release is created.
#
# Authentication uses PyPI Trusted Publishing: GitHub mints a short-lived OIDC
# token scoped to this workflow, so there is no long-lived API token stored as
# a repository secret. The matching publisher is configured on PyPI under the
# project's Publishing settings and must name this repository and this
# workflow file.

name: Upload Python Package

on:
    release:
        types: [created]

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            # Required to mint the OIDC token used for trusted publishing
            id-token: write

        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  version: "latest"
            - name: Build
              run: uv build
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
